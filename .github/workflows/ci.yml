name: Portable PAB checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-tests:
    name: Portable tests (not host acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run offline portable regression checks
        run: |
          node --test \
            test/local-diff-budget.test.mjs \
            test/local-evidence.test.mjs \
            test/file-rpc-evidence.test.mjs \
            test/local-reference-context.test.mjs
